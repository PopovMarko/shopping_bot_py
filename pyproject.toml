[project]
name = "shopping-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mark Popov", email = "hawk691@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
shopping-bot = "shopping_bot:main"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.19.1",
    "pytest-cov>=7.1.0",
]
